<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador de vehículo en una curva</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7fb,#10151d);--fg:light-dark(#16202b,#e7edf5);--card:light-dark(#fff,#1a222d);--road:light-dark(#505c67,#5c6874);--blue:#2474c6;--green:#198754;--red:#c63838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:28px 20px}h1{margin:0 0 4px}p{margin:4px 0 20px;color:color-mix(in srgb,var(--fg) 70%,transparent)}.grid{display:grid;grid-template-columns:260px 1fr;gap:24px}.controls,.stat{background:var(--card);border-radius:12px;padding:16px}.controls label{display:grid;gap:5px;margin-bottom:14px;font-weight:600}.controls output{font-weight:400}.controls input{width:100%}.status{font-size:1.1rem;font-weight:700;margin:0 0 10px}.safe{color:var(--green)}.slip{color:var(--red)}svg{width:100%;height:auto;display:block}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat span{display:block;font-size:.85rem;opacity:.75}.stat strong{font-size:1.2rem}.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.charts h2{font-size:1rem;margin:0 0 8px}.chart{background:var(--card);border-radius:12px;padding:12px}@media(max-width:700px){.grid,.charts{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><main><h1>Vehículo en una curva</h1><p>Modelo: F<sub>f</sub> ≥ F<sub>c</sub>, con v<sub>máx</sub> = √(μgr).</p><div class="grid"><section class="controls"><label>Masa: <output id="om"></output><input id="m" type="range" min="500" max="3000" step="50" value="1200"></label><label>Velocidad: <output id="ov"></output><input id="v" type="range" min="1" max="60" step=".5" value="20"></label><label>Radio: <output id="or"></output><input id="r" type="range" min="10" max="200" value="50"></label><label>Fricción μ: <output id="ou"></output><input id="u" type="range" min=".05" max="1" step=".01" value=".4"></label><label>Gravedad: <output id="og"></output><input id="g" type="range" min="1" max="12" step=".1" value="9.8"></label></section><section><div id="status" class="status" aria-live="polite"></div><svg viewBox="0 0 600 315" role="img" aria-label="Automóvil desplazándose en una carretera curva"><path d="M55 285C95 85 285 45 510 45" fill="none" stroke="var(--road)" stroke-width="105"/><path d="M55 285C95 85 285 45 510 45" fill="none" stroke="var(--bg)" stroke-width="3" stroke-dasharray="13 10"/><path id="slipline" d="M500 45H590" fill="none" stroke="var(--red)" stroke-width="4" stroke-dasharray="8 5" opacity="0"/><g id="car"><rect x="-23" y="-12" width="46" height="24" rx="5" fill="var(--blue)"/><rect x="-7" y="-8" width="20" height="16" rx="2" fill="var(--card)"/><circle cx="-14" cy="13" r="5" fill="var(--fg)"/><circle cx="14" cy="13" r="5" fill="var(--fg)"/></g></svg></section></div><section class="metrics"><div class="stat"><span>Aceleración centrípeta</span><strong id="ac"></strong></div><div class="stat"><span>Fuerza centrípeta</span><strong id="fc"></strong></div><div class="stat"><span>Fricción máxima</span><strong id="ff"></strong></div><div class="stat"><span>Velocidad máxima</span><strong id="vm"></strong></div></section><section class="charts"><div class="chart"><h2>Fuerza centrípeta vs. velocidad</h2><svg id="cf" viewBox="0 0 280 180"></svg></div><div class="chart"><h2>Aceleración vs. velocidad</h2><svg id="ca" viewBox="0 0 280 180"></svg></div><div class="chart"><h2>Velocidad máxima vs. radio</h2><svg id="cv" viewBox="0 0 280 180"></svg></div></section></main><script>
const $=x=>document.querySelector(x),ids=['m','v','r','u','g'];let phase=0,last=performance.now();const n=x=>Number(x).toLocaleString('es-CO',{maximumFractionDigits:1});function plot(id,fn,max,x,y){let w=280,h=180,l=45,b=32,iw=220,ih=130,vals=Array.from({length:50},(_,i)=>fn(max*i/49)),top=Math.max(...vals)*1.15,points=vals.map((z,i)=>`${l+iw*i/49},${12+ih*(1-z/top)}`).join(' '),px=l+iw*x/max,py=12+ih*(1-fn(x)/top);$(id).innerHTML=`<rect x="${l}" y="12" width="${iw}" height="${ih}" fill="none" stroke="currentColor" opacity=".35"/><polyline points="${points}" fill="none" stroke="var(--blue)" stroke-width="2"/><circle cx="${px}" cy="${py}" r="4" fill="var(--red)"/><text x="155" y="174" text-anchor="middle" font-size="11" fill="currentColor">${y}</text><text x="12" y="82" text-anchor="middle" transform="rotate(-90 12 82)" font-size="11" fill="currentColor">${zlabel(id)}</text><text x="45" y="158" font-size="10" fill="currentColor">0</text><text x="265" y="158" text-anchor="end" font-size="10" fill="currentColor">${n(max)}</text>`}function zlabel(id){return id=='#cf'?'Fuerza (N)':id=='#ca'?'Aceleración (m/s²)':'v máx (m/s)'}function update(){let m=+$('#m').value,v=+$('#v').value,r=+$('#r').value,u=+$('#u').value,g=+$('#g').value,ac=v*v/r,fc=m*ac,ff=u*m*g,vm=Math.sqrt(u*g*r),ok=v<=vm;$('#om').textContent=m+' kg';$('#ov').textContent=v.toFixed(1)+' m/s';$('#or').textContent=r+' m';$('#ou').textContent=u.toFixed(2);$('#og').textContent=g.toFixed(1)+' m/s²';$('#ac').textContent=n(ac)+' m/s²';$('#fc').textContent=n(fc)+' N';$('#ff').textContent=n(ff)+' N';$('#vm').textContent=n(vm)+' m/s';$('#status').textContent=ok?'Velocidad segura: el automóvil toma la curva.':'Velocidad excesiva: el automóvil pierde adherencia.';$('#status').className='status '+(ok?'safe':'slip');document.body.dataset.ok=ok?'1':'0';plot('#cf',x=>m*x*x/r,60,v,'Velocidad (m/s)');plot('#ca',x=>x*x/r,60,v,'Velocidad (m/s)');plot('#cv',x=>Math.sqrt(u*g*x),200,r,'Radio (m)')}function anim(now){let dt=Math.min(.05,(now-last)/1000);last=now;phase=(phase+dt*(document.body.dataset.ok==='1'?.17:.1))%1;let a=document.body.dataset.ok==='1'?phase:Math.min(1,phase*1.3),x=55+445*a+12*a*a,y=285-460*a+215*a*a,ang=Math.atan2(-460+430*a,445+24*a)*180/Math.PI,slip=document.body.dataset.ok==='1'?0:Math.max(0,(phase-.55)/.45);$('#car').setAttribute('transform',`translate(${x+slip*100} ${y}) rotate(${ang})`);$('#slipline').setAttribute('opacity',slip>.05?1:0);requestAnimationFrame(anim)}ids.forEach(i=>$('#'+i).oninput=update);update();requestAnimationFrame(anim);
</script></body></html>
